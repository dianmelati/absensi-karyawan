<!DOCTYPE html>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --paper:#FAF6EE; --paper-deep:#F1EAD9; --ink:#1B2433; --ink-soft:#5F6975; --line:#E4DDC9; --line-strong:#D6CBAE;
    --stamp:#AE6423; --stamp-deep:#8A4F19; --stamp-soft:#F4E3CC; --good:#3B6E4C; --good-soft:#E4EEE3;
    --bad:#A73A3A; --bad-soft:#F5E3E1; --card:#FFFFFF;
    --shadow-sm:0 1px 2px rgba(27,36,51,.05), 0 1px 1px rgba(27,36,51,.04);
    --shadow-md:0 1px 2px rgba(27,36,51,.04), 0 10px 24px -10px rgba(27,36,51,.20);
    --shadow-lg:0 2px 6px rgba(27,36,51,.06), 0 24px 48px -16px rgba(27,36,51,.28);
    --radius-sm:7px; --radius-md:11px; --radius-lg:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; letter-spacing:-0.001em;}
  h1,h2,h3,.display{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; letter-spacing:-0.02em;}
  ::selection{background:var(--stamp-soft); color:var(--stamp-deep);}
  a{text-decoration:none;}
  button, input, select, textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

  .topbar{display:flex;align-items:center;justify-content:space-between; padding:18px 24px; background:var(--paper); border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(27,36,51,.03); max-width:1200px;margin:0 auto; position:relative; z-index:2;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:36px;height:36px;border-radius:50%; background:radial-gradient(circle at 32% 28%, #C97F3E, var(--stamp) 65%, var(--stamp-deep)); color:#FFF9F0; display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk';font-weight:700;font-size:14px; box-shadow:var(--shadow-sm), inset 0 1px 1px rgba(255,255,255,.35); border:1px solid rgba(138,79,25,.4);}
  .brand-name{font-family:'Space Grotesk';font-weight:600;font-size:17px; letter-spacing:-0.01em;}
  .brand-sub{font-size:12px;color:var(--ink-soft);}

  .pill-btn{border:1px solid var(--line-strong); background:var(--card); color:var(--ink); padding:8px 15px; border-radius:100px; font-size:13px; cursor:pointer; font-family:'Inter'; font-weight:500; box-shadow:var(--shadow-sm); transition:background .15s ease, box-shadow .15s ease, transform .1s ease, border-color .15s ease; white-space:nowrap;}
  .pill-btn:hover{background:var(--paper-deep); box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .pill-btn:active{transform:translateY(0); box-shadow:var(--shadow-sm);}
  .pill-btn.small{padding:5px 12px; font-size:12px;}
  .pill-btn.good{border-color:rgba(59,110,76,.35); color:var(--good);}
  .pill-btn.good:hover{background:var(--good-soft);}
  .pill-btn.bad{border-color:rgba(167,58,58,.35); color:var(--bad);}
  .pill-btn.bad:hover{background:var(--bad-soft);}

  .center-screen{min-height:calc(100vh - 76px); display:flex; align-items:center; justify-content:center; padding:24px;}
  .panel{width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-top:3px solid var(--stamp); border-radius:var(--radius-md); padding:36px 32px; box-shadow:var(--shadow-lg);}
  .panel h2{font-size:23px;margin:0 0 5px; font-family:'Space Grotesk'; letter-spacing:-0.015em;}
  .panel .lead{color:var(--ink-soft); font-size:14px; margin:0 0 24px; line-height:1.55;}

  label{display:block; font-size:12.5px; color:var(--ink-soft); margin:16px 0 6px; font-weight:600; letter-spacing:-0.005em;}
  input, select, textarea{width:100%; padding:11px 13px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); font-size:14px; font-family:'Inter'; background:#FFFDF9; color:var(--ink); transition:border-color .15s ease, box-shadow .15s ease;}
  textarea{resize:vertical; min-height:70px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--stamp); box-shadow:0 0 0 3.5px var(--stamp-soft);}
  input::placeholder, textarea::placeholder{color:#A6A093;}

  .btn-main{width:100%; margin-top:22px; padding:12.5px; border:none; border-radius:var(--radius-sm); background:linear-gradient(180deg, #263349, var(--ink) 60%); color:var(--paper); font-family:'Inter'; font-weight:600; font-size:14.5px; cursor:pointer; box-shadow:var(--shadow-md); transition:transform .12s ease, box-shadow .15s ease, background .15s ease;}
  .btn-main:hover{transform:translateY(-1px); box-shadow:var(--shadow-lg);}
  .btn-main:active{transform:translateY(0);}
  .btn-main:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:var(--shadow-sm);}

  .switch-link{display:block; text-align:center; margin-top:18px; font-size:13px; color:var(--stamp); cursor:pointer; font-weight:500; transition:color .15s ease;}
  .switch-link:hover{color:var(--stamp-deep); text-decoration:underline;}
  .err{background:var(--bad-soft); color:var(--bad); font-size:13px; padding:11px 13px; border-radius:var(--radius-sm); margin-top:16px; line-height:1.45; border:1px solid rgba(167,58,58,.15);}
  .msg-ok{background:var(--good-soft); color:var(--good); font-size:13px; padding:11px 13px; border-radius:var(--radius-sm); margin-top:16px; line-height:1.45; border:1px solid rgba(59,110,76,.15);}

  .shell{display:flex; min-height:calc(100vh - 76px); max-width:1200px; margin:0 auto;}
  .nav{width:196px; flex-shrink:0; border-right:1px solid var(--line); padding:26px 12px;}
  .nav a{display:block; padding:9px 14px; margin-bottom:2px; font-size:14px; color:var(--ink-soft); cursor:pointer; border-radius:var(--radius-sm); transition:background .15s ease, color .15s ease;}
  .nav a:hover{background:var(--paper-deep); color:var(--ink);}
  .nav a.active{color:var(--ink); background:#FFFFFF; font-weight:600; box-shadow:var(--shadow-sm), inset 2.5px 0 0 var(--stamp);}
  .main{flex:1; padding:34px 30px; min-width:0;}
  .section-title{font-size:21px; margin:0 0 4px; font-family:'Space Grotesk'; letter-spacing:-0.015em;}
  .section-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 26px; line-height:1.5;}

  .punch-wrap{display:flex; flex-direction:column; align-items:center; padding:44px 0 26px;}
  .clock-time{font-family:'Space Grotesk'; font-size:44px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-0.02em;}
  .clock-date{color:var(--ink-soft); font-size:13.5px; margin-top:3px; margin-bottom:32px;}
  .punch-btn{width:168px; height:168px; border-radius:50%; border:none; background:radial-gradient(circle at 34% 26%, #2E3B52, var(--ink) 62%, #141B27); color:var(--paper); font-family:'Space Grotesk'; font-weight:600; font-size:16.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.3; box-shadow:0 1px 2px rgba(27,36,51,.3), 0 20px 40px -14px rgba(27,36,51,.55), inset 0 1px 1px rgba(255,255,255,.12); transition:transform .12s ease, box-shadow .15s ease; letter-spacing:-0.01em;}
  .punch-btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 2px 3px rgba(27,36,51,.3), 0 26px 48px -14px rgba(27,36,51,.6), inset 0 1px 1px rgba(255,255,255,.15);}
  .punch-btn:active:not(:disabled){transform:translateY(0) scale(.97);}
  .punch-btn.out{background:radial-gradient(circle at 34% 26%, #FFFDF9, var(--paper) 62%, #EFE7D4); color:var(--ink); box-shadow:0 1px 2px rgba(27,36,51,.08), 0 20px 40px -16px rgba(27,36,51,.22), inset 0 1px 1px rgba(255,255,255,.7); border:1px solid var(--line-strong);}
  .punch-btn:disabled{opacity:.45; cursor:not-allowed;}
  .status-row{margin-top:24px; font-size:13.5px; color:var(--ink-soft); text-align:center; max-width:320px; line-height:1.55;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-weight:600; color:var(--ink-soft); font-size:12px; border-bottom:1.5px solid var(--line-strong); padding:9px 11px; letter-spacing:-0.005em;}
  td{padding:11px 11px; border-bottom:1px solid var(--line); vertical-align:top;}
  tbody tr{transition:background .12s ease;}
  tbody tr:hover{background:rgba(174,100,35,.05);}

  .tag{display:inline-block; padding:3px 10px; border-radius:100px; font-size:11.5px; font-weight:600; letter-spacing:-0.005em;}
  .tag.hadir{background:var(--good-soft); color:var(--good);}
  .tag.terlambat{background:var(--stamp-soft); color:var(--stamp-deep);}
  .tag.alpha, .tag.izin, .tag.sakit{background:#EFEBE2; color:var(--ink-soft);}
  .tag.approved{background:var(--good-soft); color:var(--good);}
  .tag.rejected{background:var(--bad-soft); color:var(--bad);}
  .tag.pending_supervisor, .tag.pending_hr{background:var(--stamp-soft); color:var(--stamp-deep);}
  .tag.geo-ok{background:var(--good-soft); color:var(--good);}
  .tag.geo-bad{background:var(--bad-soft); color:var(--bad);}
  .tag.trial{background:var(--stamp-soft); color:var(--stamp-deep);}
  .tag.active{background:var(--good-soft); color:var(--good);}
  .tag.expired{background:#EFEBE2; color:var(--ink-soft);}
  .tag.suspended{background:var(--bad-soft); color:var(--bad);}
  .tag.archived{background:#E4E0D4; color:#5F6975;}

  .toolbar{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center;}
  .toolbar .grow{flex:1; min-width:180px;}
  .toolbar-right{margin-left:auto; display:flex; gap:10px;}
  .toolbar input, .toolbar select{width:auto; flex:1; min-width:150px;}

  .modal-box.wide{max-width:480px; text-align:left;}
  .modal-box.wide h4{font-size:17.5px; margin-bottom:2px; font-family:'Space Grotesk';}
  .modal-box .field-err{background:var(--bad-soft); color:var(--bad); font-size:12.5px; padding:9px 11px; border-radius:var(--radius-sm); margin-top:14px; display:none; line-height:1.45;}
  .modal-box .modal-actions{display:flex; gap:10px; margin-top:22px;}
  .modal-box .modal-actions .pill-btn{flex:0 0 auto;}
  .modal-box .modal-actions .btn-main{margin-top:0; flex:1;}

  .detail-grid{display:grid; grid-template-columns:130px 1fr; gap:11px 14px; font-size:13.5px; margin:15px 0 4px;}
  .detail-grid dt{color:var(--ink-soft);}
  .detail-grid dd{margin:0;}
  .action-links{display:flex; gap:12px; flex-wrap:wrap;}
  .action-links a{font-size:12.5px; color:var(--stamp); cursor:pointer; font-weight:500; transition:color .15s ease;}
  .action-links a:hover{color:var(--stamp-deep); text-decoration:underline;}
  .action-links a.danger{color:var(--bad);}
  .action-links a.danger:hover{color:#832C2C;}

  .empty{color:var(--ink-soft); font-size:13.5px; padding:22px 0;}
  .card-box{border:1px solid var(--line); border-radius:var(--radius-md); padding:19px; margin-bottom:14px; background:var(--card); box-shadow:var(--shadow-sm);}
  .card-box h4{margin:0 0 6px; font-size:14.5px; font-family:'Space Grotesk';}
  .card-box .meta{color:var(--ink-soft); font-size:12.5px; margin-bottom:10px;}
  .row-actions{display:flex; gap:8px; margin-top:10px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:720px){
    .shell{flex-direction:column;}
    .nav{width:100%; display:flex; overflow-x:auto; padding:10px 12px; border-right:none; border-bottom:1px solid var(--line);}
    .nav a{border-radius:100px; white-space:nowrap; padding:8px 14px; margin-bottom:0; margin-right:4px;}
    .nav a.active{box-shadow:var(--shadow-sm);}
    .two-col{grid-template-columns:1fr;}
  }

  /* liveness camera modal */
  .modal-backdrop{position:fixed; inset:0; background:rgba(20,27,39,0.6); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; animation:backdropIn .15s ease;}
  .modal-box{background:var(--card); border-radius:var(--radius-md); padding:26px; width:100%; max-width:380px; text-align:center; box-shadow:var(--shadow-lg); animation:modalIn .18s cubic-bezier(.2,.8,.3,1);}
  @keyframes backdropIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalIn{from{opacity:0; transform:translateY(6px) scale(.98);}to{opacity:1; transform:translateY(0) scale(1);}}
  .modal-box h4{margin:0 0 6px; font-family:'Space Grotesk';}
  .cam-wrap{position:relative; width:280px; height:210px; margin:16px auto; border-radius:var(--radius-sm); overflow:hidden; background:#111; box-shadow:var(--shadow-md);}
  .cam-wrap video, .cam-wrap canvas{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;}
  .cam-status{font-size:13px; color:var(--ink-soft); min-height:18px; margin-bottom:10px;}
  .cam-status.ok{color:var(--good); font-weight:600;}
  .cam-status.bad{color:var(--bad); font-weight:600;}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:13px; margin-bottom:26px;}
  .kpi-card{border:1px solid var(--line); border-radius:var(--radius-md); padding:17px; background:var(--card); box-shadow:var(--shadow-sm);}
  .kpi-card .kpi-num{font-family:'Space Grotesk'; font-size:27px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-0.02em;}
  .kpi-card .kpi-label{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .bar-track{background:var(--paper-deep); border-radius:100px; height:8px; overflow:hidden; margin-top:8px;}
  .bar-fill{background:linear-gradient(90deg, var(--stamp-deep), var(--stamp)); height:100%; border-radius:100px;}
  .skeleton{background:linear-gradient(90deg,var(--line) 25%,#F8F4EA 37%,var(--line) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--radius-sm);}
  @keyframes sk{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .timeline{border-left:2px solid var(--line); margin-left:8px; padding-left:22px;}
  .timeline-item{position:relative; padding-bottom:22px;}
  .timeline-item::before{content:''; position:absolute; left:-27px; top:3px; width:10px; height:10px; border-radius:50%; background:var(--stamp); box-shadow:0 0 0 3px var(--stamp-soft);}
  .timeline-item h5{margin:0 0 4px; font-size:14px; font-family:'Space Grotesk';}
  .timeline-item .meta{color:var(--ink-soft); font-size:12px;}
  @media (max-width:720px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>

<body>
<div id="root"></div>

<script>
// ---------- KONFIGURASI SUPABASE (project milik user) ----------
const SUPABASE_URL = "https://kqljftwwepnfgxqaufhk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4jUk9xjSfzL1jQg0IK0cMw_fevXMsBF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const root = document.getElementById('root');
let state = { view:'loading', tab:'clock', session:null, employee:null, company:null, err:null, msg:null, busy:false };

function setState(patch){ state = {...state, ...patch}; render(); }
function defaultTabFor(role){ return role === 'admin' ? 'dashboard' : 'clock'; }
function fmtTime(d){ return new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateTime(d){ return new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d){ return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function haversine(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
const TYPE_LABEL = { cuti:'Cuti', izin:'Izin', koreksi_absen:'Koreksi Absen', lembur:'Lembur', tukar_shift:'Tukar Shift' };
const STATUS_LABEL = { pending_supervisor:'Menunggu Supervisor', pending_hr:'Menunggu HR', approved:'Disetujui', rejected:'Ditolak' };

// ---------------- BOOTSTRAP ----------------
async function boot(){
  flushOfflineQueue();
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ setState({ view:'login', session:null, employee:null }); return; }
  const pa = await fetchPlatformAdmin(session.user.id);
  if(pa){ setState({ session, platformAdmin:pa, view:'platform-dashboard', tab:'companies' }); return; }
  const emp = await fetchEmployee(session.user.id);
  if(!emp){ setState({ view:'login', session:null, employee:null, err:'Akun belum terhubung ke data karyawan. Hubungi admin.' }); return; }
  const company = await fetchCompany(emp.company_id);
  setState({ session, employee: emp, company, view:'dashboard', tab:defaultTabFor(emp.role) });
  ensureDeviceRegistered();
  applyCompanyBrandingToPWA();
}
// PWA identity (name/icons/theme-color) is cosmetic — company_branding is
// publicly readable, so this is safe pre- or post-branding-setup, and any
// failure here must never block login/dashboard rendering.
async function applyCompanyBrandingToPWA(){
  try {
    if(!state.employee?.company_id) return;
    const { data } = await sb.from('company_branding')
      .select('pwa_name, short_name, logo_192_url, logo_512_url, favicon_url, primary_color, background_color')
      .eq('company_id', state.employee.company_id).maybeSingle();
    if(!data) return; // keep the static default manifest/icon — never break the app over this
    const name = (data.pwa_name || data.short_name || state.company?.name || 'Absensi').slice(0, 45);
    const icons = [];
    if(data.logo_192_url) icons.push({ src: data.logo_192_url, sizes:'192x192', type:'image/webp', purpose:'any' });
    if(data.logo_512_url) icons.push({ src: data.logo_512_url, sizes:'512x512', type:'image/webp', purpose:'any' });
    if(icons.length > 0){
      const manifest = {
        name, short_name: name.slice(0, 24), start_url:'./index.html', scope:'./', display:'standalone',
        background_color: data.background_color || '#FAF7F1', theme_color: data.primary_color || '#20293A', icons
      };
      const blobUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:'application/json' }));
      document.querySelector('#app-manifest')?.setAttribute('href', blobUrl);
    }
    if(data.primary_color) document.querySelector('#app-theme-color')?.setAttribute('content', data.primary_color);
    if(data.favicon_url){
      let fav = document.querySelector('#app-favicon');
      if(!fav){ fav = document.createElement('link'); fav.id = 'app-favicon'; fav.rel = 'icon'; document.head.appendChild(fav); }
      fav.setAttribute('href', data.favicon_url);
    }
    // iOS Safari ignores manifest.json icons entirely for "Add to Home
    // Screen" — it only reads apple-touch-icon.
    const appleIconSrc = data.logo_512_url || data.logo_192_url;
    if(appleIconSrc){
      let appleIcon = document.querySelector('#app-apple-icon');
      if(!appleIcon){ appleIcon = document.createElement('link'); appleIcon.id = 'app-apple-icon'; appleIcon.rel = 'apple-touch-icon'; document.head.appendChild(appleIcon); }
      appleIcon.setAttribute('href', appleIconSrc);
    }
    document.querySelector('#app-apple-title')?.setAttribute('content', name.slice(0, 24));
    document.title = name;
  } catch(e){ /* cosmetic only — silently keep platform defaults */ }
}
async function fetchEmployee(authUserId){
  const { data, error } = await sb.from('employees').select('*').eq('auth_user_id', authUserId).maybeSingle();
  if(error || !data) return null;
  return data;
}
async function fetchCompany(companyId){
  const { data } = await sb.from('companies').select('*').eq('id', companyId).maybeSingle();
  return data || null;
}
async function fetchPlatformAdmin(authUserId){
  const { data } = await sb.from('platform_admins').select('*').eq('auth_user_id', authUserId).maybeSingle();
  return data || null;
}
sb.auth.onAuthStateChange((event) => { if(event === 'SIGNED_OUT'){ setState({ view:'login', session:null, employee:null, platformAdmin:null }); } });

// ---------------- ACTIONS: AUTH ----------------
async function doLogin(email, password){
  setState({ busy:true, err:null });
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ setState({ busy:false, err:'Login gagal: ' + error.message }); return; }
  const pa = await fetchPlatformAdmin(data.user.id);
  if(pa){ setState({ busy:false, session:data.session, platformAdmin:pa, view:'platform-dashboard', tab:'companies' }); return; }
  const emp = await fetchEmployee(data.user.id);

// ---------------- ACTIONS: CLOCK IN/OUT (with geofence + shift status) ----------------
function getLocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(pos => resolve({ lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy }), () => resolve(null), { enableHighAccuracy:true, timeout:12000, maximumAge:0 });
  });
}
function checkGeofence(loc){
  if(!loc || locationsList.length === 0) return { within:null, distance:null };
  let best = null;
  for(const l of locationsList){
    const d = haversine(loc.lat, loc.lng, l.lat, l.lng);
    if(best === null || d < best.distance) best = { distance:d, within: d <= l.radius_meters };
  }
  return best;
}
function computeAttendanceMeta(){
  const shift = shiftsList.find(s => s.id === state.employee.shift_id);
  if(!shift) return { status:'hadir', lateMinutes:0, penalty:0 };
  const now = new Date();
  const [h,m] = shift.start_time.split(':').map(Number);
  const shiftStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
  const rawLateMinutes = Math.max(0, Math.round((now - shiftStart) / 60000));
  const tolerance = state.company?.late_tolerance_minutes ?? 15;
  const penaltyRate = state.company?.penalty_per_minute ?? 0;
  if(rawLateMinutes <= tolerance) return { status:'hadir', lateMinutes:0, penalty:0 };
  const billableLate = rawLateMinutes - tolerance;
  return { status:'terlambat', lateMinutes: billableLate, penalty: billableLate * penaltyRate };
}
// ---------------- AI FACIAL LIVENESS (face-api.js, jalan di browser) ----------------
const FACE_MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
let faceModelsLoaded = false;
async function ensureFaceModels(){
  if(faceModelsLoaded) return true;
  try{
    await faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL);
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(FACE_MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL);
    faceModelsLoaded = true;
    return true;
  } catch(e){ return false; }
}
function eyeAspectRatio(eye){
  const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
  const vertical = dist(eye[1],eye[5]) + dist(eye[2],eye[4]);
  const horizontal = dist(eye[0],eye[3]);
  return vertical / (2 * horizontal);
}

// Runs the camera + blink challenge inside the modal already in the DOM.
// Resolves { selfieBlob, livenessPassed } or null if the user cancels.
function runLivenessCapture(videoEl, statusEl){
  return new Promise(async (resolve) => {
    let stream = null, cancelled = false, rafId = null;
    const cleanup = () => { cancelled = true; if(rafId) cancelAnimationFrame(rafId); if(stream) stream.getTracks().forEach(t=>t.stop()); };
    document.getElementById('liveness-cancel').onclick = () => { cleanup(); resolve(null); };

    statusEl.textContent = 'Menyiapkan kamera…'; statusEl.className = 'cam-status';
    try{ stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' } }); }
    catch(e){ statusEl.textContent = 'Kamera tidak bisa diakses.'; statusEl.className = 'cam-status bad'; setTimeout(()=>resolve({ selfieBlob:null, livenessPassed:false, descriptor:null }), 1200); return; }
    videoEl.srcObject = stream; await videoEl.play();

    const ok = await ensureFaceModels();
    if(!ok){ statusEl.textContent = 'Model deteksi wajah gagal dimuat, absen tanpa liveness.'; statusEl.className='cam-status bad'; cleanup(); setTimeout(()=>resolve({ selfieBlob:null, livenessPassed:false, descriptor:null }), 1400); return; }

    statusEl.textContent = 'Arahkan wajah ke kamera…';
    let earHistory = [], blinkDetected = false, startTime = Date.now();
    const TIMEOUT_MS = 8000;

    async function loop(){
      if(cancelled) return;
      if(Date.now() - startTime > TIMEOUT_MS){
        statusEl.textContent = 'Waktu habis, absen tanpa verifikasi liveness.'; statusEl.className = 'cam-status bad';
        const blob = await captureFrame(videoEl);
        cleanup(); resolve({ selfieBlob: blob, livenessPassed:false, descriptor:null }); return;
      }
      const det = await faceapi.detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true).withFaceDescriptor();
      if(det){
        const lm = det.landmarks;
        const leftEAR = eyeAspectRatio(lm.getLeftEye());
        const rightEAR = eyeAspectRatio(lm.getRightEye());
        const ear = (leftEAR + rightEAR) / 2;
        earHistory.push(ear); if(earHistory.length > 12) earHistory.shift();
        statusEl.textContent = `Wajah terdeteksi — silakan berkedip… (EAR: ${ear.toFixed(2)})`;
        if(earHistory.length >= 4){
          const min = Math.min(...earHistory), max = Math.max(...earHistory);
          // Thresholds loosened from the original 0.09/0.19 — the tiny
          // landmark model (used here for speed) is less precise than the
          // full model, so real blinks often don't register that low.
          if(max - min > 0.05 && min < 0.24) blinkDetected = true;
        }
        if(blinkDetected){
          statusEl.textContent = 'Liveness terverifikasi ✓'; statusEl.className = 'cam-status ok';
          const blob = await captureFrame(videoEl);
          cleanup(); resolve({ selfieBlob: blob, livenessPassed:true, descriptor: Array.from(det.descriptor) }); return;
        }
      } else {
        statusEl.textContent = 'Wajah belum terdeteksi…';
      }
      rafId = requestAnimationFrame(loop);
    }
    loop();
  });
}
function captureFrame(videoEl){
  return new Promise((resolve) => {
    const c = document.createElement('canvas');
    c.width = videoEl.videoWidth || 320; c.height = videoEl.videoHeight || 240;
    c.getContext('2d').drawImage(videoEl, 0, 0, c.width, c.height);
    c.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
  });
}
function openLivenessModal(){
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `
    <div class="modal-box">
      <h4>Verifikasi Wajah</h4>
      <div class="cam-wrap"><video id="liveness-video" muted playsinline></video></div>
      <div class="cam-status" id="liveness-status">Menyiapkan kamera…</div>
      <button class="pill-btn" id="liveness-cancel">Batalkan</button>
    </div>`;
  document.body.appendChild(modal);
  return modal;
}
async function captureLiveness(){
  const modal = openLivenessModal();
  const video = modal.querySelector('#liveness-video');
  const status = modal.querySelector('#liveness-status');
  const result = await runLivenessCapture(video, status);
  modal.remove();
  return result; // null if user cancelled
}
function euclideanDistance(a, b){
  let sum = 0; for(let i=0;i<a.length;i++) sum += (a[i]-b[i])**2; return Math.sqrt(sum);
}
const FACE_MATCH_THRESHOLD = 0.55;
async function resolveFaceMatch(descriptor){
  if(!descriptor) return { match:null, distance:null };
  if(!state.employee.face_descriptor){
    // Belum ada wajah referensi — capture pertama ini otomatis jadi referensi.
    await sb.rpc('update_own_face', { descriptor, photo_url: null });
    state.employee.face_descriptor = descriptor;
    return { match:true, distance:0 };
  }
  const dist = euclideanDistance(descriptor, state.employee.face_descriptor);
  return { match: dist <= FACE_MATCH_THRESHOLD, distance: dist };
}

// ---------------- OFFLINE QUEUE (pakai window.storage, bukan localStorage) ----------------
async function queueOfflineAction(action){
  let queue = [];
  try{ const r = await window.storage.get('offline-queue', false); queue = r ? JSON.parse(r.value) : []; }catch(e){ queue = []; }
  queue.push(action);
  try{ await window.storage.set('offline-queue', JSON.stringify(queue), false); }catch(e){}
}
async function flushOfflineQueue(){
  if(!navigator.onLine) return;
  let queue = [];
  try{ const r = await window.storage.get('offline-queue', false); queue = r ? JSON.parse(r.value) : []; }catch(e){ return; }
  if(queue.length === 0) return;
  const remaining = [];
  for(const action of queue){
    const { error } = await sb.from('attendance').insert(action);
    if(error) remaining.push(action);
  }
  try{ await window.storage.set('offline-queue', JSON.stringify(remaining), false); }catch(e){}
  if(remaining.length < queue.length) await loadOpenAttendance();
}
window.addEventListener('online', flushOfflineQueue);

async function clockIn(){
  if(!navigator.onLine){
    setState({ busy:true, err:null });
    const loc = await getLocation();
    await queueOfflineAction({
      company_id: state.employee.company_id, employee_id: state.employee.id,
      clock_in_lat: loc?.lat ?? null, clock_in_lng: loc?.lng ?? null,
      status:'hadir', offline_submitted:true
    });
    setState({ busy:false, msg:'Sedang offline — absen disimpan di perangkat, akan otomatis terkirim saat internet kembali.' });
    return;
  }
  const liveness = getFeatures().face_verification ? await captureLiveness() : { selfieBlob:null, livenessPassed:null, descriptor:null };
  if(liveness === null) return; // user cancelled
  setState({ busy:true, err:null });
  const loc = await getLocation();
  const geo = checkGeofence(loc);
  const meta = computeAttendanceMeta();
  const faceResult = await resolveFaceMatch(liveness.descriptor);
  const selfieUrl = await uploadSelfie(liveness.selfieBlob);
  const { error } = await sb.from('attendance').insert({
    company_id: state.employee.company_id, employee_id: state.employee.id,
    clock_in_lat: loc?.lat ?? null, clock_in_lng: loc?.lng ?? null,
    within_geofence: geo.within, distance_meters: geo.distance,
    status: meta.status, late_minutes: meta.lateMinutes, penalty_amount: meta.penalty,
    liveness_passed: liveness.livenessPassed, selfie_url: selfieUrl,
    face_match: faceResult.match, face_distance: faceResult.distance
  });
  if(error){
    const msg = error.code === '23505' ? 'Lo sudah absen masuk dan belum absen keluar. Refresh halaman ini.' : ('Gagal absen masuk: ' + error.message);
    setState({ busy:false, err:msg }); return;
  }
  await loadOpenAttendance(); setState({ busy:false });
}

async function loadDashboardStats(){
  const companyId = state.employee.company_id;
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayIso = todayStart.toISOString();
  const todayDateStr = todayStart.toISOString().slice(0,10);

  const [{ data: emps }, { data: todaysAttendance }, { data: onLeave }, { data: pending }] = await Promise.all([
    sb.from('employees').select('id, role').eq('company_id', companyId),

    sb.from('leave_requests').select('id').eq('company_id', companyId).in('status', ['pending_supervisor','pending_hr'])
  ]);

  const totalEmployees = (emps||[]).length;
  const presentIds = new Set((todaysAttendance||[]).map(a => a.employee_id));
  const present = presentIds.size;
  const late = (todaysAttendance||[]).filter(a => a.status === 'terlambat').length;
  const onLeaveCount = new Set((onLeave||[]).map(l => l.employee_id)).size;
  const absent = Math.max(0, totalEmployees - present - onLeaveCount);

  dashboardStats = {
    totalEmployees, present, late, absent, onLeave: onLeaveCount,
    attendanceRate: totalEmployees ? Math.round((present/totalEmployees)*100) : 0,
    lateRate: present ? Math.round((late/present)*100) : 0,
    pendingApproval: (pending||[]).length
  };
  render();
}

async function loadImageFromFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
    img.src = url;
  });
}
// File-signature sniffing so we never trust the browser-reported MIME type
// or the user-supplied filename (PRD requirement).
async function sniffImageType(file){
  const buf = new Uint8Array(await file.slice(0, 12).arrayBuffer());
  if(buf[0]===0x89 && buf[1]===0x50 && buf[2]===0x4E && buf[3]===0x47) return 'image/png';
  if(buf[0]===0xFF && buf[1]===0xD8 && buf[2]===0xFF) return 'image/jpeg';
  if(buf[0]===0x52 && buf[1]===0x49 && buf[2]===0x46 && buf[3]===0x46 && buf[8]===0x57 && buf[9]===0x45 && buf[10]===0x42 && buf[11]===0x50) return 'image/webp';
  return null;
}
// Resize preserving aspect ratio, capped at maxDim, never upscaling beyond source.
function drawContainMax(img, maxDim){
  const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
  const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvas;
}
// Square canvas (for PWA/app icons): image is centered and never upscaled,
// leftover space stays transparent so non-square logos don't get distorted.
function drawContainSquare(img, size){
  const scale = Math.min(size / img.width, size / img.height, 1);
  const w = img.width * scale, h = img.height * scale;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  canvas.getContext('2d').drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
  return canvas;
}
function canvasToWebp(canvas, quality){ return new Promise(res => canvas.toBlob(b => res(b), 'image/webp', quality)); }
// Start at quality 0.85 (PRD recommended 80-85) and step down only if the
// output is still over the target size, down to a visual-quality floor.
async function compressToTarget(canvas, targetBytes, startQuality=0.85, minQuality=0.5){
  let quality = startQuality, blob = await canvasToWebp(canvas, quality);
  while(blob && blob.size > targetBytes && quality > minQuality){ quality -= 0.1; blob = await canvasToWebp(canvas, quality); }
  return blob;
}
function publicBrandingUrl(path){ return sb.storage.from('branding').getPublicUrl(path).data.publicUrl; }
async function processAndUploadLogo(file){
  if(file.size > 5*1024*1024) return { error:'File logo maksimal 5MB.' };
  const sniffed = await sniffImageType(file);
  if(!sniffed) return { error:'Format logo tidak didukung. Gunakan PNG, JPG, atau WebP.' };
  let img; try { img = await loadImageFromFile(file); } catch(e){ return { error:'Gagal membaca file logo (file rusak/bukan gambar).' }; }
  const target = 250*1024; // PRD: logo <250KB target
  const [mainBlob, blob512, blob192] = await Promise.all([
    compressToTarget(drawContainMax(img, 512), target),
    compressToTarget(drawContainSquare(img, 512), target),
    compressToTarget(drawContainSquare(img, 192), target)
  ]);
  if(!mainBlob || !blob512 || !blob192) return { error:'Gagal mengonversi logo ke WebP.' };
  const base = `company/${state.employee.company_id}/branding`;
  const results = await Promise.all([
    sb.storage.from('branding').upload(`${base}/logo.webp`, mainBlob, { contentType:'image/webp', upsert:true }),
    sb.storage.from('branding').upload(`${base}/logo-512.webp`, blob512, { contentType:'image/webp', upsert:true }),
    sb.storage.from('branding').upload(`${base}/logo-192.webp`, blob192, { contentType:'image/webp', upsert:true })
  ]);
  const failed = results.find(r => r.error);
  if(failed) return { error:'Upload logo gagal: ' + failed.error.message };
  return {
    logo_url: publicBrandingUrl(`${base}/logo.webp`),
    logo_512_url: publicBrandingUrl(`${base}/logo-512.webp`),
    logo_192_url: publicBrandingUrl(`${base}/logo-192.webp`),
    finalKB: Math.round(mainBlob.size/1024)
  };
}
async function processAndUploadFavicon(file){
  if(file.size > 5*1024*1024) return { error:'File favicon maksimal 5MB.' };
  const sniffed = await sniffImageType(file);
  if(!sniffed) return { error:'Format favicon tidak didukung. Gunakan PNG, JPG, atau WebP.' };
  let img; try { img = await loadImageFromFile(file); } catch(e){ return { error:'Gagal membaca file favicon (file rusak/bukan gambar).' }; }
  const blob = await compressToTarget(drawContainSquare(img, 64), 50*1024);
  if(!blob) return { error:'Gagal mengonversi favicon ke WebP.' };
  const path = `company/${state.employee.company_id}/branding/favicon.webp`;
  const { error } = await sb.storage.from('branding').upload(path, blob, { contentType:'image/webp', upsert:true });
  if(error) return { error:'Upload favicon gagal: ' + error.message };
  return { favicon_url: publicBrandingUrl(path) };
}

async function processAndUploadBackground(file){
  if(file.size > 5*1024*1024) return { error:'File background maksimal 5MB.' };
  const sniffed = await sniffImageType(file);
  if(!sniffed) return { error:'Format background tidak didukung. Gunakan PNG, JPG, atau WebP.' };
  let img; try { img = await loadImageFromFile(file); } catch(e){ return { error:'Gagal membaca file background.' }; }
  const blob = await compressToTarget(drawContainMax(img, 1600), 400*1024); // optimized for mobile per PRD
  if(!blob) return { error:'Gagal mengonversi background ke WebP.' };
  const path = `company/${state.employee.company_id}/branding/login-bg.webp`;
  const { error } = await sb.storage.from('branding').upload(path, blob, { contentType:'image/webp', upsert:true });
  if(error) return { error:'Upload background gagal: ' + error.message };
  return { url: publicBrandingUrl(path) };
}

// Announcement content is user-authored free text — never interpolated as raw

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(escaped){ return escaped.replace(/\n/g, '<br/>'); }

async function saveAnnouncement(payload, formEl, editingId){
  const btn = formEl.querySelector('#an-submit'), errBox = formEl.querySelector('#an-err');
  if(!payload.title || !payload.content){ errBox.textContent = 'Judul dan isi wajib diisi.'; errBox.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Menyimpan…'; errBox.style.display='none';
  const row = {
    company_id: state.employee.company_id,
    title: payload.title, content: payload.content,
    start_date: payload.startDate, end_date: payload.endDate,
    audience: payload.audience,
    department_id: payload.audience === 'department' ? payload.departmentId : null,
    status: payload.status,
    created_by: state.employee.id
  };
  let res;
  if(editingId) res = await sb.from('announcements').update(row).eq('id', editingId).select().single();
  else res = await sb.from('announcements').insert(row).select().single();
  if(res.error){ errBox.textContent = 'Gagal menyimpan: ' + res.error.message; errBox.style.display='block'; btn.disabled=false; btn.textContent = editingId?'Simpan Perubahan':'Buat Pengumuman'; return; }
  if(payload.audience === 'selected'){
    await sb.from('announcement_recipients').delete().eq('announcement_id', res.data.id);
    if(payload.selectedIds.length) await sb.from('announcement_recipients').insert(payload.selectedIds.map(eid => ({ announcement_id: res.data.id, employee_id: eid })));
  }
  closeModal();
  announcementsLoaded = false;
  setState({ msg: editingId ? 'Pengumuman diperbarui.' : 'Pengumuman dibuat.' });
}

// ---------------- ADMIN: PAYROLL EXPORT (.xlsx & .pdf) ----------------
async function fetchPayrollData(monthStr){ // monthStr = 'YYYY-MM'
  const start = monthStr + '-01T00:00:00';
  const end = new Date(new Date(start).getFullYear(), new Date(start).getMonth()+1, 1).toISOString();
  const { data } = await sb.from('attendance').select('*, employees(name,nip)')
    .eq('company_id', state.employee.company_id).gte('clock_in', start).lt('clock_in', end);
  const byEmployee = {};
  (data||[]).forEach(a => {
    const key = a.employees?.name || 'Tidak diketahui';
    if(!byEmployee[key]) byEmployee[key] = { nip:a.employees?.nip||'', hadir:0, terlambat:0, totalLateMinutes:0, totalPenalty:0 };
    byEmployee[key].hadir += 1;
    if(a.status === 'terlambat') byEmployee[key].terlambat += 1;
    byEmployee[key].totalLateMinutes += a.late_minutes || 0;
    byEmployee[key].totalPenalty += Number(a.penalty_amount || 0);
  });
  return Object.entries(byEmployee).map(([name, v]) => ({ name, ...v }));
}
async function exportPayrollXlsx(monthStr){
  const rows = await fetchPayrollData(monthStr);
  const ws = XLSX.utils.json_to_sheet(rows.map(r => ({
    'Nama': r.name, 'NIP': r.nip, 'Total Hadir': r.hadir, 'Total Terlambat': r.terlambat,
    'Total Menit Telat': r.totalLateMinutes, 'Total Potongan (Rp)': r.totalPenalty
  })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Payroll');
  XLSX.writeFile(wb, `payroll-${monthStr}.xlsx`);
}
async function exportPayrollPdf(monthStr){
  const rows = await fetchPayrollData(monthStr);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14); doc.text(`Rekap Payroll — ${monthStr}`, 14, 16);
  doc.autoTable({
    startY: 22,
    head: [['Nama','NIP','Hadir','Terlambat','Menit Telat','Potongan (Rp)']],
    body: rows.map(r => [r.name, r.nip, r.hadir, r.terlambat, r.totalLateMinutes, Number(r.totalPenalty).toLocaleString('id-ID')])
  });
  doc.save(`payroll-${monthStr}.pdf`);
}

function renderInner(){

function navItemsFor(role){

    {key:'org',label:'Organisasi'}, {key:'locations',label:'Lokasi & Shift'}, {key:'approvals',label:'Approval'},

  main.querySelector('#c-search').oninput = (e) => { companyFilter.q = e.target.value; renderPlatformCompanies(main); };

  main.querySelector('#c-filter-plan').onchange = (e) => { companyFilter.plan = e.target.value; renderPlatformCompanies(main); };
  main.querySelector('#c-refresh').onclick = () => { allCompaniesLoaded = false; setState({ msg:null }); };
  main.querySelector('#c-add').onclick = openAddCompanyModal;

  const rows = main.querySelector('#c-rows');
  if(list.length === 0){ rows.innerHTML = `<tr><td colspan="9" class="empty">Tidak ada perusahaan yang cocok dengan pencarian/filter.</td></tr>`; return; }
  rows.innerHTML = list.map(c => {
    const stats = companyEmployeeStats[c.id] || { count:0, adminName:null };
    return `

  });

  else {
    rows.innerHTML = companyInvoices.map(i => `<tr><td>${i.period}</td><td>Rp${Number(i.amount).toLocaleString('id-ID')}</td><td><span class="tag ${i.status==='paid'?'approved':(i.status==='overdue'?'rejected':'pending_hr')}">${i.status}</span></td></tr>`).join('');

  if(!allCompaniesLoaded) loadAllCompanies();
  else if(!companyInvoicesLoaded && invoiceCompanyId === null && allCompanies[0]) loadInvoicesForCompany(allCompanies[0].id);

function loginBgFieldsHtml(d){

function currentPreviewBackground(d, body){

        <div class="two-col">
          <div><label>Jam tercatat (yang salah)</label><input id="lv-orig-time" type="time" /></div>
          <div><label>Jam yang seharusnya</label><input id="lv-req-time" type="time" /></div>
        </div>
      </div>
      <label>Keterangan</label><textarea id="lv-reason" placeholder="Jelaskan alasan pengajuan"></textarea>
      <button class="btn-main" id="lv-submit" ${state.busy?'disabled':''}>Kirim Pengajuan</button>
      ${state.err ? `<div class="err">${state.err}</div>` : ''}
      ${state.msg ? `<div class="msg-ok">${state.msg}</div>` : ''}
    </div>
    <h4 style="margin-top:28px;">Riwayat Pengajuan</h4>
    <div id="lv-list"></div>
  `;
  const typeSelect = main.querySelector('#lv-type');
  const correctionFields = main.querySelector('#lv-correction-fields');
  const toggleCorrectionFields = () => { correctionFields.style.display = typeSelect.value === 'koreksi_absen' ? 'block' : 'none'; };
  typeSelect.onchange = toggleCorrectionFields;
  toggleCorrectionFields();
  main.querySelector('#lv-submit').onclick = () => {
    const type = typeSelect.value;
    const start = main.querySelector('#lv-start').value;
    const end = main.querySelector('#lv-end').value;
    const reason = main.querySelector('#lv-reason').value.trim();
    const origTime = main.querySelector('#lv-orig-time').value || null;
    const reqTime = main.querySelector('#lv-req-time').value || null;
    if(!start || !end){ setState({ err:'Tanggal wajib diisi.' }); return; }
    if(type === 'koreksi_absen' && (!origTime || !reqTime)){ setState({ err:'Jam tercatat dan jam yang seharusnya wajib diisi untuk koreksi absen.' }); return; }
    submitLeaveRequest(type, start, end, reason, origTime, reqTime);
  };
  const list = main.querySelector('#lv-list');
  if(!myLeaveLoaded){ list.innerHTML = Array(2).fill(0).map(()=>`<div class="skeleton" style="height:70px;margin-bottom:14px;"></div>`).join(''); }
  else if(myLeaveRequests.length === 0){ list.innerHTML = `<div class="empty">Belum ada pengajuan.</div>`; }
  else {
    list.innerHTML = myLeaveRequests.map(r => `
      <div class="card-box">
        <h4>${TYPE_LABEL[r.type]}</h4>
        <div class="meta">${fmtDate(r.start_date)} s/d ${fmtDate(r.end_date)} · <span class="tag ${r.status}">${STATUS_LABEL[r.status]}</span></div>
        ${r.type === 'koreksi_absen' && r.original_time ? `<div class="meta">Jam tercatat ${r.original_time.slice(0,5)} → diminta ${r.requested_time ? r.requested_time.slice(0,5) : '—'}</div>` : ''}
        ${r.reason ? `<div>${r.reason}</div>` : ''}
      </div>`).join('');
  }
  if(!myLeaveLoaded) loadMyLeaveRequests();
}

function renderHistory(main){
  main.innerHTML = `
    <h3 class="section-title">Riwayat Absensi Saya</h3>
    <div id="h-timeline"></div>
  `;
  const box = main.querySelector('#h-timeline');
  if(!myHistoryLoaded){
    box.innerHTML = Array(4).fill(0).map(()=>`<div class="skeleton" style="height:52px; margin-bottom:12px;"></div>`).join('');
  } else if(myHistory.length === 0){
    box.innerHTML = `<div class="empty">Belum ada riwayat.</div>`;
  } else {
    box.innerHTML = `<div class="timeline">${myHistory.map(a => `
      <div class="timeline-item">
        <h5>${fmtDate(a.clock_in)} — <span class="tag ${a.status}">${a.status}</span></h5>
        <div class="meta">Masuk ${fmtTime(a.clock_in)}${a.clock_out ? ' · Keluar ' + fmtTime(a.clock_out) : ' · belum absen keluar'}
          ${a.within_geofence===false ? ' · di luar radius' : (a.within_geofence===true ? ' · dalam radius' : '')}
          ${a.liveness_passed===true ? ' · wajah terverifikasi' : ''}
        </div>
      </div>`).join('')}</div>`;
  }
  if(!myHistoryLoaded) loadMyHistory();
}

window.addEventListener('unhandledrejection', (ev) => { console.error('Unhandled promise rejection:', ev.reason); });
window.addEventListener('error', (ev) => { console.error('Runtime error:', ev.error || ev.message); });
boot();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
